[project]
name = "praxiproof"
version = "0.1.0"
description = "Compile procedure manuals into executable constraints and verify operation videos against them with traceable evidence."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
]

[project.scripts]
praxiproof = "praxiproof.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxiproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["spark: integration tests that need the real Ollama models on the DGX Spark"]
addopts = "-m 'not spark'"
